<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Senhas</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 30px;
  }

  #campo-senha {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font-size: 18px;
    margin-top: 8px;
  }

  .opcoes {
    margin: 12px 0;
  }
</style>
</head>
<body>
<h1>Gerador de Senhas</h1>
<label for="campo-senha">Senha:</label>
<input type="text" id="campo-senha" readonly>
<br><br>

<div class="opcoes">

<label>
  <input type="checkbox" id="usar-maiusculas" checked>
  Letras maiúsculas
</label>
<br>
<label>
  <input type="checkbox" id="usar-numeros" checked>
  Números
</label>
<br>
<label>
  <input type="checkbox" id="usar-simbolos" checked>
  Símbolos
</label>
</div>
<br>

<button onclick="diminuiTamanho()">-</button>
<span id="numero-senha">8</span>
<button onclick="aumentaTamanho()">+</button>
<br><br>
<button onclick="geraSenha()">
Gerar nova senha
</button>

<script src="main.js"></script>
</body>
</html>
