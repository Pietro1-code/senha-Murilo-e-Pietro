<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Senhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="cabecalho">
      <span class="etiqueta">SEGURANÇA DIGITAL</span>
      <h1>Gerador de <span>senhas</span></h1>
      <p>Crie uma senha forte e difícil de adivinhar.</p>
    </header>

    <main class="painel">
      <div class="rotulo-senha">
        <label for="campo-senha">Sua senha</label>
      </div>
      <input type="text" id="campo-senha" readonly aria-label="Senha gerada">

      <section class="configuracoes" aria-label="Opções da senha">
        <div class="titulo-secao">Incluir na senha</div>
        <div class="opcoes">
          <label>
            <input type="checkbox" id="usar-maiusculas" checked>
            <span>Letras maiúsculas</span>
          </label>

          <label>
            <input type="checkbox" id="usar-numeros" checked>
            <span>Números</span>
          </label>

          <label>
            <input type="checkbox" id="usar-simbolos" checked>
            <span>Símbolos</span>
          </label>
        </div>
      </section>

      <div id="status-senha" role="status">Senha aprovada: false</div>

      <div class="controle-tamanho">
        <span>Comprimento</span>
        <div class="contador">
          <button type="button" onclick="diminuiTamanho()" aria-label="Diminuir comprimento">−</button>
          <span id="numero-senha">8</span>
          <button type="button" onclick="aumentaTamanho()" aria-label="Aumentar comprimento">+</button>
        </div>
      </div>

      <button class="botao-gerar" type="button" onclick="geraSenha()">
        <span aria-hidden="true">✦</span> Gerar nova senha
      </button>
    </main>
    <footer>Senhas são geradas localmente no seu navegador.</footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
